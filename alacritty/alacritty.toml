[cursor]
thickness = 0.3
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking ="On"

[font]
size = 12

[font.normal]
family = "IosevkaTerm Nerd Font"

[scrolling]
history = 10000
multiplier = 1

[window]
decorations = "full"
startup_mode = "Windowed"

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 12
y = 12

[font.offset]
# x = 1
y = 1

[colors]
draw_bold_text_with_bright_colors = false

[general]
live_config_reload = true
import = ["/home/rivaldoe/.config/alacritty/tokyo.toml"]
# import = ["/home/rivaldoe/.config/alacritty/mocha.toml"]
